name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check src build.zig
      - run: zig build test --summary all
      # Release builds go through LLVM's optimizer, where vector-lowering
      # bugs show up that Debug (self-hosted backend on Linux) never sees.
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      - run: zig build -Doptimize=ReleaseSafe
      # Windows Debug goes through LLVM with the Windows calling convention;
      # pin AVX2 so the x86 SIMD paths are compiled whatever the runner's CPU.
      - if: runner.os == 'Windows'
        run: zig build test -Dcpu=x86_64_v3 --summary all

  cpu-levels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [x86_64, x86_64_v2, x86_64_v3]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test -Dcpu=${{ matrix.cpu }} -Doptimize=ReleaseSafe --summary all
      # Debug through LLVM (what Windows and macOS Debug use).
      - run: zig build test -Dcpu=${{ matrix.cpu }} -Duse-llvm --summary all

  opencv-difftest:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon: checks the NEON paths against OpenCV.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy opencv-python-headless==5.0.0.*
      - run: zig build difftest -Doptimize=ReleaseSafe

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-macos
          - x86_64-macos
          - riscv64-linux-musl
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

  zig-master:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - run: zig build test --summary all

  # `visar track` for real on a Mac: AVFoundation device discovery (runners
  # have no camera), the camera path failing cleanly, the AppKit window
  # (screenshot uploaded as an artifact) and the pipeline's throughput.
  macos-track:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build -Doptimize=ReleaseFast
      - name: List cameras (none on a runner; must exit 0)
        run: |
          ./zig-out/bin/visar track --list-cameras | tee cameras.txt
          ./zig-out/bin/visar track --list-cameras --json | tee cameras.json
      - name: Camera without a camera fails cleanly (exit 1, no crash)
        run: |
          set +e
          ./zig-out/bin/visar track --headless --frames 10 > nocam.txt 2>&1
          code=$?
          cat nocam.txt
          test "$code" -eq 1
      - name: Synthetic source, headless, 1280x720
        run: |
          ./zig-out/bin/visar track --source synthetic --headless --frames 600 --json > headless.json
          cat headless.json
      - name: Synthetic source with two MOSSE locks
        run: |
          ./zig-out/bin/visar track --source synthetic --headless --frames 600 --lock 602,481,123,48 --lock 129,514,63,63 --json > locks.json
          cat locks.json
      - name: Window (AppKit) with a screenshot
        run: |
          ./zig-out/bin/visar track --source synthetic --frames 240 --fps 30 --lock 602,481,123,48 --json > window.json 2> window.err &
          pid=$!
          sleep 3
          screencapture -x shot.png || echo "screencapture failed"
          code=0
          wait "$pid" || code=$?
          cat window.err window.json
          test -s shot.png
          exit "$code"
      - name: x86_64 build under Rosetta
        continue-on-error: true
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos --prefix x86
          file x86/bin/visar
          x86/bin/visar track --list-cameras
          x86/bin/visar track --source synthetic --headless --frames 300 -q --json > x86.json
          x86/bin/visar track --source synthetic --frames 60 --fps 30 -q
          cat x86.json
      - name: Job summary
        if: always()
        run: |
          {
            echo "### visar track on macOS ($(uname -m), $(sw_vers -productVersion))"
            echo
            echo "#### Cameras"
            echo '```'
            cat cameras.txt 2>/dev/null
            echo '```'
            for f in headless locks window x86; do
              if [ -s "$f.json" ]; then
                echo "#### $f"
                echo '```json'
                cat "$f.json"
                echo '```'
              fi
            done
            echo "The window screenshot is attached as the artifact 'visar-track-window'."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visar-track-window
          path: shot.png
          if-no-files-found: warn
