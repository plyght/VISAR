name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check src build.zig
      - run: zig build test --summary all
      # Release builds go through LLVM's optimizer, where vector-lowering
      # bugs show up that Debug (self-hosted backend on Linux) never sees.
      - run: zig build test -Doptimize=ReleaseSafe --summary all
      - run: zig build -Doptimize=ReleaseSafe

  cpu-levels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [x86_64, x86_64_v2, x86_64_v3]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test -Dcpu=${{ matrix.cpu }} -Doptimize=ReleaseSafe --summary all
      # Debug through LLVM (what Windows and macOS Debug use).
      - run: zig build test -Dcpu=${{ matrix.cpu }} -Duse-llvm --summary all

  opencv-difftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy opencv-python-headless==5.0.0.*
      - run: zig build difftest -Doptimize=ReleaseSafe

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-macos
          - riscv64-linux-musl
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

  zig-master:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - run: zig build test --summary all
