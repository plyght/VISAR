name: demos

# Renders the live tracking demo and benchmarks VISAR against OpenCV on a
# stock GitHub-hosted runner, posts both to the job summary, and publishes
# the results to the `demo-assets` branch (embedded by the README).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demos
  cancel-in-progress: true

jobs:
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy opencv-python-headless==5.0.0.*

      - name: Runner
        run: |
          echo "### Runner" >> runner.md
          echo '```' >> runner.md
          lscpu | grep -E "Model name|^CPU\(s\)|Flags" | sed 's/Flags:.*\(avx512[a-z]*\).*/Flags: ... \1 .../' >> runner.md
          free -h | head -2 >> runner.md
          echo '```' >> runner.md

      - name: Tracking demo
        run: zig build demo-track -Doptimize=ReleaseFast -- --out track.gif > track.md

      - name: Benchmark vs OpenCV (1 thread)
        run: zig build bench -Doptimize=ReleaseFast -- --threads 1 --md bench-1t.md

      - name: Benchmark vs OpenCV (all cores)
        run: zig build bench -Doptimize=ReleaseFast -- --threads 0 --md bench-mt.md

      - name: Job summary
        run: |
          {
            echo "## VISAR demos — ${GITHUB_SHA::7}"
            echo
            echo "![tracking](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/demo-assets/track.gif)"
            echo
            cat track.md
            echo
            echo "### Speed vs OpenCV, 1 thread"
            cat bench-1t.md
            echo
            echo "### Speed vs OpenCV, all cores"
            cat bench-mt.md
            echo
            cat runner.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: visar-demos
          path: |
            track.gif
            track.md
            bench-1t.md
            bench-mt.md
            runner.md

      - name: Publish to demo-assets
        run: |
          mkdir pub && cp track.gif track.md bench-1t.md bench-mt.md runner.md pub/
          cd pub
          git init -q -b demo-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Generated by the demos workflow for ${GITHUB_SHA}. Do not edit." > README.md
          git add -A
          git commit -q -m "Demo assets for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" demo-assets
